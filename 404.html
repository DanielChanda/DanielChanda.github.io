<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Danny Chanda</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to content</a>

  <header>
    <div class="container navbar">
      <a href="index.html" class="navbar-brand">
        Danny<span>Chanda</span>
      </a>
      <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar-links" id="navbar-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="section" style="min-height: 60vh; display: flex; align-items: center;">
      <div class="container">
        <div class="section-header text-center">
          <span class="section-kicker">404</span>
          <h2 class="section-title">Page Not Found</h2>
          <p class="section-description">The page you are looking for does not exist.</p>
        </div>
        <div style="text-align: center; margin-top: 2rem;">
          <a href="index.html" class="btn btn-primary">Go to Homepage</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; <span id="year"></span> Danny Chanda. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const toggle = document.querySelector('.mobile-toggle');
    const nav = document.getElementById('navbar-links');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.querySelectorAll('.navbar-links a').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
